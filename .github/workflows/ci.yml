name: build-and-test

on: [push, pull request]

jobs:
  build-and-test:
    runs-on: ubuntu latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest -v

      - run: python -m build 

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

            
